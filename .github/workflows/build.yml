name: Build NEXA CHAT Signed APK, AAB & iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Pillow for Custom App Logo Generation
        run: |
          python3 -m pip install --quiet pillow

      - name: Generate Android Project Files & Custom NEXA CHAT Logo
        shell: python3 {0}
        run: |
          import os, glob, pathlib, textwrap
          from PIL import Image, ImageDraw

          os.makedirs("app/src/main/java/com/nexachats/app", exist_ok=True)
          os.makedirs("app/src/main/res/values", exist_ok=True)
          os.makedirs("app/src/main/res/mipmap-anydpi-v26", exist_ok=True)

          # 1. Find uploaded "Nexa Chat Neon Glass Logo.png" (or any image in repo root)
          logo_files = []
          for ext in ("*.png", "*.jpg", "*.jpeg", "*.webp"):
              logo_files.extend(glob.glob(ext))

          if logo_files:
              src_logo = Image.open(logo_files[0]).convert("RGBA")
          else:
              src_logo = Image.new("RGBA", (1024, 1024), (8, 20, 34, 255))

          w, h = src_logo.size
          # Trim outer empty margin (~8%) so the Neon Glass logo fills the Android icon completely
          crop_box = (int(w * 0.08), int(h * 0.08), int(w * 0.92), int(h * 0.92))
          core_logo = src_logo.crop(crop_box)

          densities = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }

          for folder, px in densities.items():
              out_dir = f"app/src/main/res/{folder}"
              os.makedirs(out_dir, exist_ok=True)

              # Standard Launcher Icon
              sq_img = core_logo.resize((px, px), Image.Resampling.LANCZOS)
              sq_img.save(f"{out_dir}/ic_launcher.png", "PNG")

              # Round Launcher Icon
              mask = Image.new("L", (px, px), 0)
              ImageDraw.Draw(mask).ellipse((0, 0, px, px), fill=255)
              rnd_img = Image.new("RGBA", (px, px), (0, 0, 0, 0))
              rnd_img.paste(sq_img, (0, 0), mask)
              rnd_img.save(f"{out_dir}/ic_launcher_round.png", "PNG")

              # Adaptive Foreground Icon (Android 8.0+)
              fg_size = int(px * 2.25)
              inner_size = int(fg_size * 0.70)
              fg_canvas = Image.new("RGBA", (fg_size, fg_size), (8, 20, 34, 255))
              fg_inner = core_logo.resize((inner_size, inner_size), Image.Resampling.LANCZOS)
              offset = (fg_size - inner_size) // 2
              fg_canvas.paste(fg_inner, (offset, offset), fg_inner)
              fg_canvas.save(f"{out_dir}/ic_launcher_foreground.png", "PNG")

          pathlib.Path("app/src/main/res/values/colors.xml").write_text(textwrap.dedent('''
              <?xml version="1.0" encoding="utf-8"?>
              <resources>
                  <color name="ic_launcher_background">#081422</color>
              </resources>
          ''').strip() + "\n")

          adaptive_xml = textwrap.dedent('''
              <?xml version="1.0" encoding="utf-8"?>
              <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
                  <background android:drawable="@color/ic_launcher_background"/>
                  <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
              </adaptive-icon>
          ''').strip() + "\n"

          pathlib.Path("app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml").write_text(adaptive_xml)
          pathlib.Path("app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml").write_text(adaptive_xml)

          pathlib.Path("settings.gradle").write_text(textwrap.dedent(r'''
              pluginManagement {
                  repositories {
                      google()
                      mavenCentral()
                      gradlePluginPortal()
                  }
              }
              dependencyResolutionManagement {
                  repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
                  repositories {
                      google()
                      mavenCentral()
                  }
              }
              rootProject.name = "NexaChat"
              include ':app'
          ''').strip() + "\n")

          pathlib.Path("build.gradle").write_text(textwrap.dedent(r'''
              plugins {
                  id 'com.android.application' version '8.2.2' apply false
                  id 'com.google.gms.google-services' version '4.4.1' apply false
              }
          ''').strip() + "\n")

          pathlib.Path("gradle.properties").write_text(textwrap.dedent(r'''
              org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
              android.useAndroidX=true
              android.nonTransitiveRClass=true
          ''').strip() + "\n")

          pathlib.Path("app/build.gradle").write_text(textwrap.dedent(r'''
              plugins {
                  id 'com.android.application'
                  id 'com.google.gms.google-services'
              }

              android {
                  namespace 'com.nexachats.app'
                  compileSdk 34

                  defaultConfig {
                      applicationId "com.nexachats.app"
                      minSdk 24
                      targetSdk 34
                      versionCode 3
                      versionName "3.0"
                  }

                  signingConfigs {
                      release {
                          storeFile file("release-key.jks")
                          storePassword "nexachatpass"
                          keyAlias "nexachat"
                          keyPassword "nexachatpass"
                      }
                  }

                  buildTypes {
                      release {
                          signingConfig signingConfigs.release
                          minifyEnabled false
                          shrinkResources false
                      }
                  }

                  compileOptions {
                      sourceCompatibility JavaVersion.VERSION_17
                      targetCompatibility JavaVersion.VERSION_17
                  }

                  lint {
                      checkReleaseBuilds false
                      abortOnError false
                  }
              }

              dependencies {
                  implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
                  implementation platform('com.google.firebase:firebase-bom:32.8.0')
                  implementation 'com.google.firebase:firebase-messaging'
              }
          ''').strip() + "\n")

          pathlib.Path("app/google-services.json").write_text(textwrap.dedent(r'''
              {
                "project_info": {
                  "project_number": "839828901701",
                  "project_id": "nexachat-57109",
                  "storage_bucket": "nexachat-57109.firebasestorage.app"
                },
                "client": [
                  {
                    "client_info": {
                      "mobilesdk_app_id": "1:839828901701:android:09e2b35ec8f3e67de2f82c",
                      "android_client_info": {
                        "package_name": "com.nexachats.app"
                      }
                    },
                    "oauth_client": [],
                    "api_key": [
                      {
                        "current_key": "AIzaSyCQHsmzjgjyKCrXWIQxiSic3m9j5ouhkYU"
                      }
                    ],
                    "services": {
                      "appinvite_service": {
                        "other_platform_oauth_client": []
                      }
                    }
                  }
                ],
                "configuration_version": "1"
              }
          ''').strip() + "\n")

          pathlib.Path("app/src/main/AndroidManifest.xml").write_text(textwrap.dedent(r'''
              <?xml version="1.0" encoding="utf-8"?>
              <manifest xmlns:android="http://schemas.android.com/apk/res/android">

                  <uses-permission android:name="android.permission.INTERNET" />
                  <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
                  <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
                  <uses-permission android:name="android.permission.VIBRATE" />
                  <uses-permission android:name="android.permission.CAMERA" />
                  <uses-permission android:name="android.permission.RECORD_AUDIO" />
                  <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
                  <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
                  <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />

                  <application
                      android:allowBackup="false"
                      android:icon="@mipmap/ic_launcher"
                      android:roundIcon="@mipmap/ic_launcher_round"
                      android:label="NEXA CHAT"
                      android:usesCleartextTraffic="false"
                      android:hardwareAccelerated="true"
                      android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                      <activity
                          android:name=".MainActivity"
                          android:exported="true"
                          android:launchMode="singleTask"
                          android:configChanges="orientation|screenSize|keyboardHidden">
                          <intent-filter>
                              <action android:name="android.intent.action.MAIN" />
                              <category android:name="android.intent.category.LAUNCHER" />
                          </intent-filter>
                      </activity>

                      <service
                          android:name=".NexaFirebaseMessagingService"
                          android:exported="false">
                          <intent-filter>
                              <action android:name="com.google.firebase.MESSAGING_EVENT" />
                          </intent-filter>
                      </service>
                  </application>
              </manifest>
          ''').strip() + "\n")

          pathlib.Path("app/src/main/java/com/nexachats/app/MainActivity.java").write_text(textwrap.dedent(r'''
              package com.nexachats.app;

              import android.Manifest;
              import android.annotation.SuppressLint;
              import android.app.Activity;
              import android.app.Notification;
              import android.app.NotificationChannel;
              import android.app.NotificationManager;
              import android.app.PendingIntent;
              import android.content.Context;
              import android.content.Intent;
              import android.content.SharedPreferences;
              import android.content.pm.PackageManager;
              import android.graphics.BitmapFactory;
              import android.hardware.display.DisplayManager;
              import android.net.Uri;
              import android.os.Build;
              import android.os.Bundle;
              import android.view.Display;
              import android.view.WindowManager;
              import android.webkit.GeolocationPermissions;
              import android.webkit.JavascriptInterface;
              import android.webkit.PermissionRequest;
              import android.webkit.ValueCallback;
              import android.webkit.WebChromeClient;
              import android.webkit.WebSettings;
              import android.webkit.WebView;
              import android.webkit.WebViewClient;

              import com.google.firebase.messaging.FirebaseMessaging;

              import org.json.JSONArray;
              import org.json.JSONObject;

              import java.util.ArrayList;
              import java.util.List;

              public class MainActivity extends Activity {
                  public static final String CHANNEL_ID = "nexa_shutter_channel_v1";
                  private static final String APP_URL = "https://nexachats.in";
                  private static final int FILE_CHOOSER_REQ = 102;
                  private WebView webView;
                  private ValueCallback<Uri[]> fileUploadCallback;
                  private String pendingGroupIdFromNotif = null;
                  private DisplayManager displayManager;

                  private final DisplayManager.DisplayListener castDisplayListener = new DisplayManager.DisplayListener() {
                      @Override
                      public void onDisplayAdded(int displayId) {
                          notifyWebCastState();
                      }

                      @Override
                      public void onDisplayRemoved(int displayId) {
                          notifyWebCastState();
                      }

                      @Override
                      public void onDisplayChanged(int displayId) {
                          notifyWebCastState();
                      }
                  };

                  @SuppressLint("SetJavaScriptEnabled")
                  @Override
                  protected void onCreate(Bundle savedInstanceState) {
                      super.onCreate(savedInstanceState);

                      // OS-Level Blackout for TV, Laptop, Xbox Screen Casting & Screenshots
                      getWindow().setFlags(
                          WindowManager.LayoutParams.FLAG_SECURE,
                          WindowManager.LayoutParams.FLAG_SECURE
                      );

                      createShutterNotificationChannel();
                      requestEssentialRuntimePermissions();

                      displayManager = (DisplayManager) getSystemService(Context.DISPLAY_SERVICE);
                      if (displayManager != null) {
                          displayManager.registerDisplayListener(castDisplayListener, null);
                      }

                      webView = new WebView(this);
                      setContentView(webView);

                      WebSettings ws = webView.getSettings();
                      ws.setJavaScriptEnabled(true);
                      ws.setDomStorageEnabled(true);
                      ws.setDatabaseEnabled(true);
                      ws.setCacheMode(WebSettings.LOAD_DEFAULT);
                      ws.setMediaPlaybackRequiresUserGesture(false);
                      ws.setAllowFileAccess(true);
                      ws.setAllowContentAccess(true);

                      // Clear only file cache so new code updates load immediately without clearing localStorage
                      webView.clearCache(true);

                      NexaBridge bridge = new NexaBridge(this);
                      webView.addJavascriptInterface(bridge, "NexaNativeBridge");
                      webView.addJavascriptInterface(bridge, "Android");

                      webView.setWebViewClient(new WebViewClient() {
                          @Override
                          public void onPageFinished(WebView view, String url) {
                              super.onPageFinished(view, url);
                              pushFcmTokenToWeb();
                              notifyWebCastState();
                              if (pendingGroupIdFromNotif != null && !pendingGroupIdFromNotif.isEmpty()) {
                                  final String gId = pendingGroupIdFromNotif;
                                  pendingGroupIdFromNotif = null;
                                  webView.postDelayed(() ->
                                      webView.evaluateJavascript("if(window.openChatFromShutterNotification) window.openChatFromShutterNotification('" + gId + "');", null),
                                      900
                                  );
                              }
                          }
                      });

                      webView.setWebChromeClient(new WebChromeClient() {
                          @Override
                          public void onPermissionRequest(final PermissionRequest request) {
                              runOnUiThread(() -> request.grant(request.getResources()));
                          }

                          @Override
                          public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback callback) {
                              callback.invoke(origin, true, false);
                          }

                          @Override
                          public boolean onShowFileChooser(WebView wv, ValueCallback<Uri[]> filePathCallback, FileChooserParams fileChooserParams) {
                              if (fileUploadCallback != null) fileUploadCallback.onReceiveValue(null);
                              fileUploadCallback = filePathCallback;
                              try {
                                  startActivityForResult(fileChooserParams.createIntent(), FILE_CHOOSER_REQ);
                              } catch (Exception e) {
                                  fileUploadCallback = null;
                                  return false;
                              }
                              return true;
                          }
                      });

                      handleNotificationIntent(getIntent());
                      webView.loadUrl(APP_URL);
                      fetchAndStoreFcmToken();
                  }

                  @Override
                  protected void onDestroy() {
                      if (displayManager != null) {
                          displayManager.unregisterDisplayListener(castDisplayListener);
                      }
                      super.onDestroy();
                  }

                  private boolean checkExternalDisplayActive() {
                      if (displayManager == null) return false;
                      Display[] displays = displayManager.getDisplays();
                      if (displays != null && displays.length > 1) return true;
                      Display[] pres = displayManager.getDisplays(DisplayManager.DISPLAY_CATEGORY_PRESENTATION);
                      return pres != null && pres.length > 0;
                  }

                  private void notifyWebCastState() {
                      final boolean casting = checkExternalDisplayActive();
                      if (webView != null) {
                          runOnUiThread(() ->
                              webView.evaluateJavascript("if(window.onNexaScreenCastStateChanged) window.onNexaScreenCastStateChanged(" + casting + ");", null)
                          );
                      }
                  }

                  @Override
                  protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                      super.onActivityResult(requestCode, resultCode, data);
                      if (requestCode == FILE_CHOOSER_REQ && fileUploadCallback != null) {
                          Uri[] results = WebChromeClient.FileChooserParams.parseResult(resultCode, data);
                          fileUploadCallback.onReceiveValue(results);
                          fileUploadCallback = null;
                      }
                  }

                  @Override
                  protected void onNewIntent(Intent intent) {
                      super.onNewIntent(intent);
                      setIntent(intent);
                      handleNotificationIntent(intent);
                  }

                  private void handleNotificationIntent(Intent intent) {
                      if (intent == null) return;
                      String gId = intent.getStringExtra("groupId");
                      if (gId != null && !gId.isEmpty()) {
                          if (webView != null) {
                              webView.evaluateJavascript("if(window.openChatFromShutterNotification) window.openChatFromShutterNotification('" + gId + "');", null);
                          } else {
                              pendingGroupIdFromNotif = gId;
                          }
                      }
                  }

                  private void fetchAndStoreFcmToken() {
                      FirebaseMessaging.getInstance().getToken().addOnCompleteListener(task -> {
                          if (!task.isSuccessful()) return;
                          String token = task.getResult();
                          if (token != null && !token.isEmpty()) {
                              getSharedPreferences("nexa_prefs", MODE_PRIVATE).edit().putString("fcm_token", token).apply();
                              pushFcmTokenToWeb();
                          }
                      });
                  }

                  private void pushFcmTokenToWeb() {
                      String token = getSharedPreferences("nexa_prefs", MODE_PRIVATE).getString("fcm_token", "");
                      if (token != null && !token.isEmpty() && webView != null) {
                          runOnUiThread(() ->
                              webView.evaluateJavascript("if(window.onNexaNativeFcmToken) window.onNexaNativeFcmToken('" + token + "');", null)
                          );
                      }
                  }

                  private void requestEssentialRuntimePermissions() {
                      List<String> needed = new ArrayList<>();
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                          if (checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                              needed.add(Manifest.permission.POST_NOTIFICATIONS);
                          }
                      }
                      if (checkSelfPermission(Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {
                          needed.add(Manifest.permission.CAMERA);
                      }
                      if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                          needed.add(Manifest.permission.RECORD_AUDIO);
                      }
                      if (!needed.isEmpty()) {
                          requestPermissions(needed.toArray(new String[0]), 101);
                      }
                  }

                  private void createShutterNotificationChannel() {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          NotificationChannel ch = new NotificationChannel(
                              CHANNEL_ID,
                              "NEXA Chat Shutter Notifications",
                              NotificationManager.IMPORTANCE_HIGH
                          );
                          ch.enableVibration(true);
                          NotificationManager nm = getSystemService(NotificationManager.class);
                          if (nm != null) nm.createNotificationChannel(ch);
                      }
                  }

                  public static boolean isGroupMutedOrArchivedLocally(Context ctx, String groupId) {
                      if (groupId == null || groupId.isEmpty()) return false;
                      SharedPreferences sp = ctx.getSharedPreferences("nexa_prefs", MODE_PRIVATE);
                      if (!sp.getBoolean("shutter_enabled", true)) return true;

                      try {
                          JSONArray arch = new JSONArray(sp.getString("archived_chats", "[]"));
                          for (int i = 0; i < arch.length(); i++) {
                              if (groupId.equals(arch.optString(i))) return true;
                          }
                      } catch (Exception ignored) {}

                      try {
                          JSONObject muted = new JSONObject(sp.getString("muted_groups", "{}"));
                          if (muted.has(groupId)) {
                              Object val = muted.get(groupId);
                              long until = -2;
                              if (val instanceof JSONObject) until = ((JSONObject) val).optLong("until", 0);
                              else if (val instanceof Number) until = ((Number) val).longValue();
                              else if ("always".equals(String.valueOf(val)) || "-1".equals(String.valueOf(val))) until = -1;

                              if (until == -1 || until > System.currentTimeMillis()) return true;
                          }
                      } catch (Exception ignored) {}

                      return false;
                  }

                  public static void displayNativeShutterNotification(Context ctx, String groupId, String title, String body) {
                      if (isGroupMutedOrArchivedLocally(ctx, groupId)) return;

                      Intent intent = new Intent(ctx, MainActivity.class);
                      intent.addFlags(Intent.FLAG_ACTIVITY_CLEAR_TOP | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                      intent.putExtra("groupId", groupId != null ? groupId : "");

                      int notifId = (groupId != null && !groupId.isEmpty()) ? groupId.hashCode() : (int) System.currentTimeMillis();
                      PendingIntent pi = PendingIntent.getActivity(
                          ctx,
                          notifId,
                          intent,
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                      );

                      Notification.Builder b;
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          b = new Notification.Builder(ctx, CHANNEL_ID);
                      } else {
                          b = new Notification.Builder(ctx);
                          b.setPriority(Notification.PRIORITY_HIGH);
                      }

                      b.setSmallIcon(R.mipmap.ic_launcher)
                       .setLargeIcon(BitmapFactory.decodeResource(ctx.getResources(), R.mipmap.ic_launcher))
                       .setContentTitle(title != null ? title : "NEXA CHAT")
                       .setContentText(body != null ? body : "New Encrypted Message")
                       .setAutoCancel(true)
                       .setContentIntent(pi);

                      NotificationManager nm = (NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE);
                      if (nm != null) {
                          nm.notify("nexa_grp_" + (groupId != null ? groupId : "default"), notifId, b.build());
                      }
                  }

                  @Override
                  public void onBackPressed() {
                      if (webView != null && webView.canGoBack()) webView.goBack();
                      else super.onBackPressed();
                  }

                  public class NexaBridge {
                      private final Context ctx;
                      NexaBridge(Context c) { this.ctx = c; }

                      @JavascriptInterface
                      public String getFcmToken() {
                          return ctx.getSharedPreferences("nexa_prefs", MODE_PRIVATE).getString("fcm_token", "");
                      }

                      @JavascriptInterface
                      public boolean isScreenCastingActive() {
                          return checkExternalDisplayActive();
                      }

                      @JavascriptInterface
                      public void setCastPrivacyEnabled(final boolean enabled) {
                          runOnUiThread(() -> {
                              if (enabled) {
                                  getWindow().setFlags(
                                      WindowManager.LayoutParams.FLAG_SECURE,
                                      WindowManager.LayoutParams.FLAG_SECURE
                                  );
                              }
                          });
                      }

                      @JavascriptInterface
                      public void clearWebCacheOnly() {
                          runOnUiThread(() -> {
                              if (webView != null) webView.clearCache(true);
                          });
                      }

                      @JavascriptInterface
                      public void setMutedGroups(String jsonStr) {
                          ctx.getSharedPreferences("nexa_prefs", MODE_PRIVATE).edit().putString("muted_groups", jsonStr != null ? jsonStr : "{}").apply();
                      }

                      @JavascriptInterface
                      public void setArchivedChats(String jsonStr) {
                          ctx.getSharedPreferences("nexa_prefs", MODE_PRIVATE).edit().putString("archived_chats", jsonStr != null ? jsonStr : "[]").apply();
                      }

                      @JavascriptInterface
                      public void setShutterNotificationsEnabled(boolean enabled) {
                          ctx.getSharedPreferences("nexa_prefs", MODE_PRIVATE).edit().putBoolean("shutter_enabled", enabled).apply();
                      }

                      @JavascriptInterface
                      public void setActiveChatId(String groupId) {
                          ctx.getSharedPreferences("nexa_prefs", MODE_PRIVATE).edit().putString("active_chat_id", groupId != null ? groupId : "").apply();
                      }

                      @JavascriptInterface
                      public void showGroupNotification(String groupId, String title, String body) {
                          displayNativeShutterNotification(ctx, groupId, title, body);
                      }

                      @JavascriptInterface
                      public void cancelGroupNotification(String groupId) {
                          if (groupId == null) return;
                          NotificationManager nm = (NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE);
                          if (nm != null) nm.cancel("nexa_grp_" + groupId, groupId.hashCode());
                      }

                      @JavascriptInterface
                      public void clearAllNotifications() {
                          NotificationManager nm = (NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE);
                          if (nm != null) nm.cancelAll();
                      }

                      @JavascriptInterface
                      public void requestNotificationPermission() {
                          runOnUiThread(MainActivity.this::requestEssentialRuntimePermissions);
                      }
                  }
              }
          ''').strip() + "\n")

          pathlib.Path("app/src/main/java/com/nexachats/app/NexaFirebaseMessagingService.java").write_text(textwrap.dedent(r'''
              package com.nexachats.app;

              import com.google.firebase.messaging.FirebaseMessagingService;
              import com.google.firebase.messaging.RemoteMessage;
              import java.util.Map;

              public class NexaFirebaseMessagingService extends FirebaseMessagingService {

                  @Override
                  public void onNewToken(String token) {
                      super.onNewToken(token);
                      getSharedPreferences("nexa_prefs", MODE_PRIVATE).edit().putString("fcm_token", token).apply();
                  }

                  @Override
                  public void onMessageReceived(RemoteMessage remoteMessage) {
                      super.onMessageReceived(remoteMessage);
                      Map<String, String> data = remoteMessage.getData();
                      if (data == null || data.isEmpty()) return;

                      String groupId = data.get("groupId");
                      String title = data.get("title");
                      String body = data.get("body");

                      MainActivity.displayNativeShutterNotification(getApplicationContext(), groupId, title, body);
                  }
              }
          ''').strip() + "\n")

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/release-key.jks \
            -alias nexachat \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass nexachatpass \
            -keypass nexachatpass \
            -dname "CN=NexaChat, OU=IMR, O=IMR, L=City, S=State, C=IN"

      - name: Install Gradle 8.5 & Build Signed Release APK & AAB
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          curl -sL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o gradle.zip
          unzip -q gradle.zip
          ./gradle-8.5/bin/gradle assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXA-CHAT-Signed-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Signed AAB (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: NEXA-CHAT-Signed-AAB
          path: app/build/outputs/bundle/release/*.aab

  build_ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Pillow for iOS App Icon Generation
        run: |
          python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet --user pillow

      - name: Generate iOS Bundle, Custom Logo & Swift Source
        shell: python3 {0}
        run: |
          import os, glob, json, pathlib, textwrap
          from PIL import Image

          app_bundle = "ios_app/Payload/NexaChat.app"
          iconset_dir = "ios_app/Assets.xcassets/AppIcon.appiconset"
          os.makedirs(app_bundle, exist_ok=True)
          os.makedirs(iconset_dir, exist_ok=True)

          # 1. Generate iOS App Icons from uploaded "Nexa Chat Neon Glass Logo.png"
          logo_files = []
          for ext in ("*.png", "*.jpg", "*.jpeg", "*.webp"):
              logo_files.extend(glob.glob(ext))

          if logo_files:
              src_logo = Image.open(logo_files[0]).convert("RGBA")
          else:
              src_logo = Image.new("RGBA", (1024, 1024), (8, 20, 34, 255))

          w, h = src_logo.size
          crop_box = (int(w * 0.08), int(h * 0.08), int(w * 0.92), int(h * 0.92))
          core_logo = src_logo.crop(crop_box)

          # iOS requires opaque RGB PNG (no alpha channel)
          bg_rgb = Image.new("RGB", core_logo.size, (8, 20, 34))
          bg_rgb.paste(core_logo, mask=core_logo.split()[3])

          icon_specs = [
              ("Icon-20@2x.png", 40),
              ("Icon-20@3x.png", 60),
              ("Icon-29@2x.png", 58),
              ("Icon-29@3x.png", 87),
              ("Icon-40@2x.png", 80),
              ("Icon-40@3x.png", 120),
              ("Icon-60@2x.png", 120),
              ("Icon-60@3x.png", 180),
              ("Icon-1024.png", 1024),
          ]

          for fname, px in icon_specs:
              resized = bg_rgb.resize((px, px), Image.Resampling.LANCZOS)
              resized.save(f"{iconset_dir}/{fname}", "PNG")
              resized.save(f"{app_bundle}/{fname}", "PNG")

          bg_rgb.resize((120, 120), Image.Resampling.LANCZOS).save(f"{app_bundle}/AppIcon60x60@2x.png", "PNG")
          bg_rgb.resize((180, 180), Image.Resampling.LANCZOS).save(f"{app_bundle}/AppIcon60x60@3x.png", "PNG")

          contents_json = {
              "images": [
                  {"idiom": "iphone", "size": "20x20", "scale": "2x", "filename": "Icon-20@2x.png"},
                  {"idiom": "iphone", "size": "20x20", "scale": "3x", "filename": "Icon-20@3x.png"},
                  {"idiom": "iphone", "size": "29x29", "scale": "2x", "filename": "Icon-29@2x.png"},
                  {"idiom": "iphone", "size": "29x29", "scale": "3x", "filename": "Icon-29@3x.png"},
                  {"idiom": "iphone", "size": "40x40", "scale": "2x", "filename": "Icon-40@2x.png"},
                  {"idiom": "iphone", "size": "40x40", "scale": "3x", "filename": "Icon-40@3x.png"},
                  {"idiom": "iphone", "size": "60x60", "scale": "2x", "filename": "Icon-60@2x.png"},
                  {"idiom": "iphone", "size": "60x60", "scale": "3x", "filename": "Icon-60@3x.png"},
                  {"idiom": "ios-marketing", "size": "1024x1024", "scale": "1x", "filename": "Icon-1024.png"}
              ],
              "info": {"version": 1, "author": "xcode"}
          }
          pathlib.Path(f"{iconset_dir}/Contents.json").write_text(json.dumps(contents_json, indent=2))

          # 2. Write Info.plist directly into Payload/NexaChat.app
          pathlib.Path(f"{app_bundle}/Info.plist").write_text(textwrap.dedent(r'''
              <?xml version="1.0" encoding="UTF-8"?>
              <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
              <plist version="1.0">
              <dict>
                  <key>CFBundleDevelopmentRegion</key>
                  <string>en</string>
                  <key>CFBundleDisplayName</key>
                  <string>NEXA CHAT</string>
                  <key>CFBundleExecutable</key>
                  <string>NexaChat</string>
                  <key>CFBundleIdentifier</key>
                  <string>com.nexachats.app</string>
                  <key>CFBundleInfoDictionaryVersion</key>
                  <string>6.0</string>
                  <key>CFBundleName</key>
                  <string>NexaChat</string>
                  <key>CFBundlePackageType</key>
                  <string>APPL</string>
                  <key>CFBundleShortVersionString</key>
                  <string>3.0</string>
                  <key>CFBundleVersion</key>
                  <string>3</string>
                  <key>MinimumOSVersion</key>
                  <string>15.0</string>
                  <key>LSRequiresIPhoneOS</key>
                  <true/>
                  <key>UIDeviceFamily</key>
                  <array>
                      <integer>1</integer>
                      <integer>2</integer>
                  </array>
                  <key>CFBundleIcons</key>
                  <dict>
                      <key>CFBundlePrimaryIcon</key>
                      <dict>
                          <key>CFBundleIconFiles</key>
                          <array>
                              <string>AppIcon60x60</string>
                              <string>Icon-60</string>
                          </array>
                          <key>CFBundleIconName</key>
                          <string>AppIcon</string>
                      </dict>
                  </dict>
                  <key>UILaunchScreen</key>
                  <dict/>
                  <key>UIRequiredDeviceCapabilities</key>
                  <array>
                      <string>arm64</string>
                  </array>
                  <key>UISupportedInterfaceOrientations</key>
                  <array>
                      <string>UIInterfaceOrientationPortrait</string>
                  </array>
                  <key>NSCameraUsageDescription</key>
                  <string>NEXA CHAT needs camera access to share photos and videos.</string>
                  <key>NSMicrophoneUsageDescription</key>
                  <string>NEXA CHAT needs microphone access for encrypted voice calls and voice notes.</string>
                  <key>NSPhotoLibraryUsageDescription</key>
                  <string>NEXA CHAT needs photo library access to share media.</string>
                  <key>NSLocationWhenInUseUsageDescription</key>
                  <string>NEXA CHAT needs location access to share current and live locations in chat.</string>
              </dict>
              </plist>
          ''').strip() + "\n")

          # 3. Write unified Swift source file (main.swift)
          pathlib.Path("ios_app/main.swift").write_text(textwrap.dedent(r'''
              import UIKit
              import WebKit
              import UserNotifications

              class ViewController: UIViewController, WKScriptMessageHandler, WKUIDelegate, WKNavigationDelegate {
                  private var webView: WKWebView!
                  private var privacyBlackoutView: UIView!
                  private let appUrl = URL(string: "https://nexachats.in")!

                  override func viewDidLoad() {
                      super.viewDidLoad()
                      view.backgroundColor = UIColor(red: 11.0/255.0, green: 20.0/255.0, blue: 26.0/255.0, alpha: 1.0)

                      let contentController = WKUserContentController()
                      contentController.add(self, name: "NexaNativeBridge")

                      let bridgeJs = """
                      window.NexaNativeBridge = {
                          getFcmToken: function() { return localStorage.getItem('nexa_ios_push_token') || 'ios_native_client'; },
                          isScreenCastingActive: function() { return window.__nexaIosCaptured === true; },
                          setCastPrivacyEnabled: function(en) { window.webkit.messageHandlers.NexaNativeBridge.postMessage({action:'setCastPrivacy', enabled: !!en}); },
                          clearWebCacheOnly: function() { window.webkit.messageHandlers.NexaNativeBridge.postMessage({action:'clearCache'}); },
                          setMutedGroups: function(s) { localStorage.setItem('nexa_muted_groups', s || '{}'); },
                          setArchivedChats: function(s) { localStorage.setItem('nexa_archived_chats', s || '[]'); },
                          setShutterNotificationsEnabled: function(en) { localStorage.setItem('nexa_shutter_enabled', en ? '1' : '0'); },
                          setActiveChatId: function(id) { localStorage.setItem('nexa_active_chat_id', id || ''); },
                          showGroupNotification: function(groupId, title, body) {
                              window.webkit.messageHandlers.NexaNativeBridge.postMessage({action:'notify', groupId: groupId || '', title: title || 'NEXA CHAT', body: body || 'New Encrypted Message'});
                          },
                          cancelGroupNotification: function(groupId) {},
                          clearAllNotifications: function() {},
                          requestNotificationPermission: function() {}
                      };
                      window.Android = window.NexaNativeBridge;
                      """
                      let script = WKUserScript(source: bridgeJs, injectionTime: .atDocumentStart, forMainFrameOnly: false)
                      contentController.addUserScript(script)

                      let config = WKWebViewConfiguration()
                      config.userContentController = contentController
                      config.allowsInlineMediaPlayback = true
                      config.mediaTypesRequiringUserActionForPlayback = []
                      config.allowsAirPlayForMediaPlayback = false

                      let cacheTypes: Set<String> = [WKWebsiteDataTypeDiskCache, WKWebsiteDataTypeMemoryCache]
                      WKWebsiteDataStore.default().removeData(ofTypes: cacheTypes, modifiedSince: Date(timeIntervalSince1970: 0)) {}

                      webView = WKWebView(frame: view.bounds, configuration: config)
                      webView.autoresizingMask = [.flexibleWidth, .flexibleHeight]
                      webView.uiDelegate = self
                      webView.navigationDelegate = self
                      webView.scrollView.bounces = false
                      view.addSubview(webView)

                      setupPrivacyBlackoutShield()
                      NotificationCenter.default.addObserver(self, selector: #selector(screenCaptureChanged), name: UIScreen.capturedDidChangeNotification, object: nil)

                      webView.load(URLRequest(url: appUrl, cachePolicy: .reloadIgnoringLocalCacheData, timeoutInterval: 30))
                  }

                  private func setupPrivacyBlackoutShield() {
                      privacyBlackoutView = UIView(frame: view.bounds)
                      privacyBlackoutView.autoresizingMask = [.flexibleWidth, .flexibleHeight]
                      privacyBlackoutView.backgroundColor = .black
                      privacyBlackoutView.isHidden = !UIScreen.main.isCaptured
                      view.addSubview(privacyBlackoutView)
                  }

                  @objc private func screenCaptureChanged() {
                      let captured = UIScreen.main.isCaptured || UIScreen.screens.count > 1
                      privacyBlackoutView.isHidden = !captured
                      webView.evaluateJavaScript("window.__nexaIosCaptured = \(captured); if(window.onNexaScreenCastStateChanged) window.onNexaScreenCastStateChanged(\(captured));", completionHandler: nil)
                  }

                  func userContentController(_ userContentController: WKUserContentController, didReceive message: WKScriptMessage) {
                      guard let dict = message.body as? [String: Any], let action = dict["action"] as? String else { return }
                      if action == "notify" {
                          let title = (dict["title"] as? String) ?? "NEXA CHAT"
                          let body = (dict["body"] as? String) ?? "New Encrypted Message"
                          let groupId = (dict["groupId"] as? String) ?? "default"

                          let content = UNMutableNotificationContent()
                          content.title = title
                          content.body = body
                          content.sound = .default

                          let req = UNNotificationRequest(identifier: "nexa_grp_\(groupId)", content: content, trigger: nil)
                          UNUserNotificationCenter.current().add(req, withCompletionHandler: nil)
                      } else if action == "clearCache" {
                          let cacheTypes: Set<String> = [WKWebsiteDataTypeDiskCache, WKWebsiteDataTypeMemoryCache]
                          WKWebsiteDataStore.default().removeData(ofTypes: cacheTypes, modifiedSince: Date(timeIntervalSince1970: 0)) {}
                      }
                  }

                  @available(iOS 15.0, *)
                  func webView(_ webView: WKWebView, requestMediaCapturePermissionFor origin: WKSecurityOrigin, initiatedByFrame frame: WKFrameInfo, type: WKMediaCaptureType, decisionHandler: @escaping (WKPermissionDecision) -> Void) {
                      decisionHandler(.grant)
                  }
              }

              class AppDelegate: UIResponder, UIApplicationDelegate, UNUserNotificationCenterDelegate {
                  var window: UIWindow?

                  func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                      UNUserNotificationCenter.current().delegate = self
                      UNUserNotificationCenter.current().requestAuthorization(options: [.alert, .sound, .badge]) { _, _ in }
                      application.registerForRemoteNotifications()

                      window = UIWindow(frame: UIScreen.main.bounds)
                      window?.rootViewController = ViewController()
                      window?.makeKeyAndVisible()
                      return true
                  }

                  func userNotificationCenter(_ center: UNNotificationCenter, willPresent notification: UNNotification, withCompletionHandler completionHandler: @escaping (UNNotificationPresentationOptions) -> Void) {
                      completionHandler([.banner, .sound, .badge])
                  }
              }

              UIApplicationMain(CommandLine.argc, CommandLine.unsafeArgv, nil, NSStringFromClass(AppDelegate.self))
          ''').strip() + "\n")

      - name: Compile iOS Binary & Package into NEXA-CHAT.ipa
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos swiftc \
            -target arm64-apple-ios15.0 \
            -sdk "$SDK_PATH" \
            -O \
            ios_app/main.swift \
            -framework UIKit \
            -framework WebKit \
            -framework UserNotifications \
            -framework Foundation \
            -framework CoreGraphics \
            -o ios_app/Payload/NexaChat.app/NexaChat

          chmod +x ios_app/Payload/NexaChat.app/NexaChat

          xcrun actool ios_app/Assets.xcassets \
            --compile ios_app/Payload/NexaChat.app \
            --platform iphoneos \
            --minimum-deployment-target 15.0 \
            --app-icon AppIcon \
            --output-partial-info-plist ios_app/partial.plist || true

          plutil -convert binary1 ios_app/Payload/NexaChat.app/Info.plist
          codesign --force --deep --sign - ios_app/Payload/NexaChat.app

          cd ios_app
          zip -r -q NexaChat-iOS.ipa Payload

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: NEXA-CHAT-iOS-IPA
          path: ios_app/NexaChat-iOS.ipa
